name: LTH.Persistence.Services
author: Rajabzadeh
description: Parse loaded systemd service units, including inactive units, without pager, headings or truncation.

implied_permissions:
  - EXECVE

sources:
  - precondition: |
      SELECT OS From info() where OS = 'linux'
    queries:
      - |
        LET services = SELECT Stdout FROM execve(argv=['systemctl', 'list-units', '--type=service', '--all', '--plain', '--no-legend', '--no-pager', '--full'], length=10000000)

        LET all_services = SELECT grok(grok="%{NOTSPACE:Unit}%{SPACE}%{NOTSPACE:Load}%{SPACE}%{NOTSPACE:Active}%{SPACE}%{NOTSPACE:Sub}%{SPACE}%{GREEDYDATA:Description}", data=Line) AS Parsed
        FROM parse_lines(accessor="data", filename=services.Stdout)

        SELECT * FROM foreach(row=all_services, column="Parsed") WHERE Unit =~ "\\.service$"

