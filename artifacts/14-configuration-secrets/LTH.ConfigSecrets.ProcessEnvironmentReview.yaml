name: LTH.ConfigSecrets.ProcessEnvironmentReview
author: Rajabzadeh
description: |
  Linux Threat Hunting - Section 2.14 Configuration and Secrets Review

  This artifact reviews process environment variables for secret-like variable
  names. It does not return the secret value. It only returns the variable key.

type: CLIENT

required_permissions:
  - EXECVE

sources:
  - name: ProcessEnvironmentSecretIndicators
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      LET Raw <=
        SELECT Stdout
        FROM execve(argv=[
          "/bin/sh",
          "-c",
          "for d in /proc/[0-9]*; do pid=${d##*/}; [ -r \"$d/environ\" ] || continue; name=$(cat \"$d/comm\" 2>/dev/null); tr '\\0' '\\n' < \"$d/environ\" 2>/dev/null | awk -F= -v pid=\"$pid\" -v name=\"$name\" 'BEGIN{IGNORECASE=1} $1 ~ /(SECRET|TOKEN|PASSWORD|PASSWD|API_KEY|ACCESS_KEY|PRIVATE_KEY|CLIENT_SECRET|AWS_|AZURE_|GOOGLE_|GCP_)/ {print pid \"\t\" name \"\t\" $1 \"\tProcess environment contains secret-like variable name\"}'; done || true"
        ])

      SELECT split(string=Line, sep_string="\t")[0] AS Pid,
             split(string=Line, sep_string="\t")[1] AS ProcessName,
             split(string=Line, sep_string="\t")[2] AS VariableName,
             split(string=Line, sep_string="\t")[3] AS Indicator,
             "HIGH" AS Severity,
             "Process environment contains secret-like variable name without exposing value" AS Reason
      FROM foreach(
        row=Raw,
        query={
          SELECT Line
          FROM parse_lines(accessor="data", filename=Stdout)
          WHERE Line
        }
      )
