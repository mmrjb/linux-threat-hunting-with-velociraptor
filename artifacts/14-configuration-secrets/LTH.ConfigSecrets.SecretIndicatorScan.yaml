name: LTH.ConfigSecrets.SecretIndicatorScan
author: Rajabzadeh
description: |
  Linux Threat Hunting - Section 2.14 Configuration and Secrets Review

  This artifact scans small configuration files for secret indicators and
  credential keywords. It does not return the matching line content or secret
  value. It only returns path, line number, and indicator type.

type: CLIENT

required_permissions:
  - EXECVE

sources:
  - name: SecretIndicatorMatches
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      LET Raw <=
        SELECT Stdout
        FROM execve(argv=[
          "/bin/sh",
          "-c",
          "for d in /etc /opt /usr/local/etc /var/www /srv/www /home /root /etc/kubernetes /var/lib/kubelet /etc/docker /etc/containerd; do [ -e \"$d\" ] || continue; find \"$d\" -xdev -maxdepth 10 -type f -size -5M \\( -iname '*.conf' -o -iname '*.cfg' -o -iname '*.ini' -o -iname '*.yaml' -o -iname '*.yml' -o -iname '*.json' -o -iname '*.xml' -o -iname '*.properties' -o -iname '*.toml' -o -iname '*.php' -o -iname '.env' -o -iname '*.env' -o -iname 'credentials' -o -iname 'config' \\) -print 2>/dev/null; done | while IFS= read -r f; do awk 'BEGIN{IGNORECASE=1} /aws_access_key_id|aws_secret_access_key|access_key|secret_key|client_secret|private_key|api_key|apikey|token|password|passwd|db_password|database_password|authorization:|bearer / {print FILENAME \"\t\" NR \"\tSecret or credential keyword\"}' \"$f\" 2>/dev/null; done || true"
        ])

      SELECT split(string=Line, sep_string="\t")[0] AS Path,
             split(string=Line, sep_string="\t")[1] AS LineNumber,
             split(string=Line, sep_string="\t")[2] AS Indicator,
             if(condition=split(string=Line, sep_string="\t")[2] =~ "(?i)(secret|credential|private|token|password|key)",
                then="HIGH",
                else="MEDIUM") AS Severity,
             "Secret indicator found without exposing value" AS Reason
      FROM foreach(
        row=Raw,
        query={
          SELECT Line
          FROM parse_lines(accessor="data", filename=Stdout)
          WHERE Line
        }
      )
