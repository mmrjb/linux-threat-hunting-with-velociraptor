name: LTH.ConfigSecrets
author: Rajabzadeh
description: |
  Linux Threat Hunting - Section 2.14 Configuration and Secrets Review

  This wrapper artifact collects Linux configuration and secrets review data,
  including configuration file inventory, recently modified configs, private
  key files, secret-like files, secret indicators, weak permissions, process
  environment secret indicators, and application config indicators.

type: CLIENT

implied_permissions:
  - EXECVE
  - FILESYSTEM_READ

sources:
  - name: ConfigFiles
    description: Configuration file inventory.
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      SELECT *
      FROM Artifact.LTH.ConfigSecrets.ConfigInventory(source="ConfigFiles")

  - name: RecentlyModifiedConfigFiles
    description: Recently modified configuration files.
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      SELECT *
      FROM Artifact.LTH.ConfigSecrets.ConfigInventory(source="RecentlyModifiedConfigFiles")

  - name: PrivateKeyFiles
    description: Private key and certificate material inventory.
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      SELECT *
      FROM Artifact.LTH.ConfigSecrets.SecretFileInventory(source="PrivateKeyFiles")

  - name: SecretLikeFiles
    description: Secret-like files by name or path.
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      SELECT *
      FROM Artifact.LTH.ConfigSecrets.SecretFileInventory(source="SecretLikeFiles")

  - name: SecretIndicatorMatches
    description: Secret indicators without exposing values.
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      SELECT *
      FROM Artifact.LTH.ConfigSecrets.SecretIndicatorScan(source="SecretIndicatorMatches")

  - name: WeakSecretPermissions
    description: Secret-like files with weak permissions.
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      SELECT *
      FROM Artifact.LTH.ConfigSecrets.PermissionReview(source="WeakSecretPermissions")

  - name: WorldWritableConfigFiles
    description: World-writable configuration files.
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      SELECT *
      FROM Artifact.LTH.ConfigSecrets.PermissionReview(source="WorldWritableConfigFiles")

  - name: ProcessEnvironmentSecretIndicators
    description: Secret-like process environment variable names without values.
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      SELECT *
      FROM Artifact.LTH.ConfigSecrets.ProcessEnvironmentReview(source="ProcessEnvironmentSecretIndicators")

  - name: ApplicationConfigFiles
    description: Web and application configuration files.
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      SELECT *
      FROM Artifact.LTH.ConfigSecrets.ApplicationConfigReview(source="ApplicationConfigFiles")

  - name: ApplicationSecretIndicators
    description: Application config secret indicators without exposing values.
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      SELECT *
      FROM Artifact.LTH.ConfigSecrets.ApplicationConfigReview(source="ApplicationSecretIndicators")

  - name: FileFinder
    description: General monitored config and secret file finder results.
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      SELECT *
      FROM Artifact.LTH.ConfigSecrets.FileFinder()
