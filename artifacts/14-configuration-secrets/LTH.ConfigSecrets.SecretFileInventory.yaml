name: LTH.ConfigSecrets.SecretFileInventory
author: Rajabzadeh
description: |
  Linux Threat Hunting - Section 2.14 Configuration and Secrets Review

  This artifact inventories private keys, credential-like files, token files,
  environment files, cloud credential files, Kubernetes configs, and certificate
  or key material. It does not return file contents.

type: CLIENT

required_permissions:
  - EXECVE

sources:
  - name: PrivateKeyFiles
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      LET Raw <=
        SELECT Stdout
        FROM execve(argv=[
          "/bin/sh",
          "-c",
          "for d in /root /home /etc /opt /var/www /srv/www; do [ -e \"$d\" ] || continue; find \"$d\" -xdev -maxdepth 10 -type f \\( -name 'id_rsa' -o -name 'id_dsa' -o -name 'id_ecdsa' -o -name 'id_ed25519' -o -iname '*.pem' -o -iname '*.key' -o -iname '*.p12' -o -iname '*.pfx' \\) -printf '%p\t%m\t%u\t%g\t%s\t%TY-%Tm-%Td %TH:%TM:%TS\n' 2>/dev/null; done || true"
        ])

      SELECT split(string=Line, sep_string="\t")[0] AS OSPath,
             split(string=Line, sep_string="\t")[1] AS OctalMode,
             split(string=Line, sep_string="\t")[2] AS Owner,
             split(string=Line, sep_string="\t")[3] AS Group,
             split(string=Line, sep_string="\t")[4] AS Size,
             split(string=Line, sep_string="\t")[5] AS MTime,
             if(condition=split(string=Line, sep_string="\t")[1] =~ "[4-7]$",
                then="HIGH",
                else="MEDIUM") AS Severity,
             if(condition=split(string=Line, sep_string="\t")[1] =~ "[4-7]$",
                then="Private key or certificate material is world-readable",
                else="Private key or certificate material found") AS Reason
      FROM foreach(
        row=Raw,
        query={
          SELECT Line
          FROM parse_lines(accessor="data", filename=Stdout)
          WHERE Line
        }
      )

  - name: SecretLikeFiles
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      LET Raw <=
        SELECT Stdout
        FROM execve(argv=[
          "/bin/sh",
          "-c",
          "for d in /root /home /etc /opt /var/www /srv/www /var/lib/kubelet /etc/kubernetes /etc/docker /etc/containerd; do [ -e \"$d\" ] || continue; find \"$d\" -xdev -maxdepth 10 -type f \\( -iname '*secret*' -o -iname '*token*' -o -iname '*credential*' -o -iname 'credentials' -o -iname '.env' -o -iname '*.env' -o -iname '*password*' -o -iname '*passwd*' -o -iname '*kubeconfig*' -o -iname 'config' -o -path '*/.aws/*' -o -path '*/.azure/*' -o -path '*/.config/gcloud/*' -o -path '*/.config/rclone/*' \\) -printf '%p\t%m\t%u\t%g\t%s\t%TY-%Tm-%Td %TH:%TM:%TS\n' 2>/dev/null; done || true"
        ])

      SELECT split(string=Line, sep_string="\t")[0] AS OSPath,
             split(string=Line, sep_string="\t")[1] AS OctalMode,
             split(string=Line, sep_string="\t")[2] AS Owner,
             split(string=Line, sep_string="\t")[3] AS Group,
             split(string=Line, sep_string="\t")[4] AS Size,
             split(string=Line, sep_string="\t")[5] AS MTime,
             if(condition=split(string=Line, sep_string="\t")[0] =~ "(?i)(secret|token|credential|password|passwd|\\.env|\\.aws|\\.azure|gcloud|rclone|kubeconfig)",
                then="HIGH",
                else="MEDIUM") AS Severity,
             "Secret-like file found by name or path" AS Reason
      FROM foreach(
        row=Raw,
        query={
          SELECT Line
          FROM parse_lines(accessor="data", filename=Stdout)
          WHERE Line
        }
      )
