name: LTH.ConfigSecrets.ApplicationConfigReview
author: Rajabzadeh
description: |
  Linux Threat Hunting - Section 2.14 Configuration and Secrets Review

  This artifact reviews common web and application configuration files and
  identifies database, API, token, and application secret indicators without
  exposing secret values.

type: CLIENT

required_permissions:
  - EXECVE

sources:
  - name: ApplicationConfigFiles
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      LET Raw <=
        SELECT Stdout
        FROM execve(argv=[
          "/bin/sh",
          "-c",
          "for d in /var/www /srv/www /opt /home /root; do [ -e \"$d\" ] || continue; find \"$d\" -xdev -maxdepth 10 -type f \\( -iname 'wp-config.php' -o -iname 'config.php' -o -iname 'database.php' -o -iname 'settings.php' -o -iname 'settings.py' -o -iname 'application.yml' -o -iname 'application.yaml' -o -iname '.env' -o -iname '*.env' -o -iname 'docker-compose.yml' -o -iname 'docker-compose.yaml' \\) -printf '%p\t%m\t%u\t%g\t%s\t%TY-%Tm-%Td %TH:%TM:%TS\n' 2>/dev/null; done || true"
        ])

      SELECT split(string=Line, sep_string="\t")[0] AS OSPath,
             split(string=Line, sep_string="\t")[1] AS OctalMode,
             split(string=Line, sep_string="\t")[2] AS Owner,
             split(string=Line, sep_string="\t")[3] AS Group,
             split(string=Line, sep_string="\t")[4] AS Size,
             split(string=Line, sep_string="\t")[5] AS MTime,
             "MEDIUM" AS Severity,
             "Application or web configuration file" AS Reason
      FROM foreach(
        row=Raw,
        query={
          SELECT Line
          FROM parse_lines(accessor="data", filename=Stdout)
          WHERE Line
        }
      )

  - name: ApplicationSecretIndicators
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      LET Raw <=
        SELECT Stdout
        FROM execve(argv=[
          "/bin/sh",
          "-c",
          "for d in /var/www /srv/www /opt /home /root; do [ -e \"$d\" ] || continue; find \"$d\" -xdev -maxdepth 10 -type f -size -5M \\( -iname 'wp-config.php' -o -iname 'config.php' -o -iname 'database.php' -o -iname 'settings.php' -o -iname 'settings.py' -o -iname 'application.yml' -o -iname 'application.yaml' -o -iname '.env' -o -iname '*.env' -o -iname 'docker-compose.yml' -o -iname 'docker-compose.yaml' \\) -print 2>/dev/null; done | while IFS= read -r f; do awk 'BEGIN{IGNORECASE=1} /DB_PASSWORD|DATABASE_PASSWORD|MYSQL_PASSWORD|POSTGRES_PASSWORD|REDIS_PASSWORD|SECRET_KEY|APP_KEY|APP_SECRET|JWT_SECRET|API_KEY|TOKEN|PASSWORD|PASSWD/ {print FILENAME \"\t\" NR \"\tApplication secret indicator\"}' \"$f\" 2>/dev/null; done || true"
        ])

      SELECT split(string=Line, sep_string="\t")[0] AS Path,
             split(string=Line, sep_string="\t")[1] AS LineNumber,
             split(string=Line, sep_string="\t")[2] AS Indicator,
             "HIGH" AS Severity,
             "Application configuration contains secret indicator without exposing value" AS Reason
      FROM foreach(
        row=Raw,
        query={
          SELECT Line
          FROM parse_lines(accessor="data", filename=Stdout)
          WHERE Line
        }
      )
