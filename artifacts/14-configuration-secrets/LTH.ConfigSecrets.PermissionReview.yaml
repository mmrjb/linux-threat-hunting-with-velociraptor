name: LTH.ConfigSecrets.PermissionReview
author: Rajabzadeh
description: |
  Linux Threat Hunting - Section 2.14 Configuration and Secrets Review

  This artifact identifies weak permissions on configuration and secret-like
  files, including world-readable secrets and world-writable configuration files.

type: CLIENT

required_permissions:
  - EXECVE

sources:
  - name: WeakSecretPermissions
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      LET Raw <=
        SELECT Stdout
        FROM execve(argv=[
          "/bin/sh",
          "-c",
          "for d in /root /home /etc /opt /var/www /srv/www /etc/kubernetes /var/lib/kubelet /etc/docker /etc/containerd; do [ -e \"$d\" ] || continue; find \"$d\" -xdev -maxdepth 10 -type f \\( -iname '*secret*' -o -iname '*token*' -o -iname '*credential*' -o -iname 'credentials' -o -iname '.env' -o -iname '*.env' -o -iname '*.pem' -o -iname '*.key' -o -name 'id_rsa' -o -name 'id_dsa' -o -name 'id_ecdsa' -o -name 'id_ed25519' \\) \\( -perm /004 -o -perm /002 \\) -printf '%p\t%m\t%u\t%g\t%s\t%TY-%Tm-%Td %TH:%TM:%TS\n' 2>/dev/null; done || true"
        ])

      SELECT split(string=Line, sep_string="\t")[0] AS OSPath,
             split(string=Line, sep_string="\t")[1] AS OctalMode,
             split(string=Line, sep_string="\t")[2] AS Owner,
             split(string=Line, sep_string="\t")[3] AS Group,
             split(string=Line, sep_string="\t")[4] AS Size,
             split(string=Line, sep_string="\t")[5] AS MTime,
             "HIGH" AS Severity,
             "Secret-like file has weak world-readable or world-writable permission" AS Reason
      FROM foreach(
        row=Raw,
        query={
          SELECT Line
          FROM parse_lines(accessor="data", filename=Stdout)
          WHERE Line
        }
      )

  - name: WorldWritableConfigFiles
    precondition: |
      SELECT OS
      FROM info()
      WHERE OS = "linux"
    query: |
      LET Raw <=
        SELECT Stdout
        FROM execve(argv=[
          "/bin/sh",
          "-c",
          "for d in /etc /opt /usr/local/etc /var/www /srv/www /home /root; do [ -e \"$d\" ] || continue; find \"$d\" -xdev -maxdepth 10 -type f \\( -iname '*.conf' -o -iname '*.cfg' -o -iname '*.ini' -o -iname '*.yaml' -o -iname '*.yml' -o -iname '*.json' -o -iname '*.properties' -o -iname '*.php' -o -iname '.env' -o -iname '*.env' \\) -perm /002 -printf '%p\t%m\t%u\t%g\t%s\t%TY-%Tm-%Td %TH:%TM:%TS\n' 2>/dev/null; done || true"
        ])

      SELECT split(string=Line, sep_string="\t")[0] AS OSPath,
             split(string=Line, sep_string="\t")[1] AS OctalMode,
             split(string=Line, sep_string="\t")[2] AS Owner,
             split(string=Line, sep_string="\t")[3] AS Group,
             split(string=Line, sep_string="\t")[4] AS Size,
             split(string=Line, sep_string="\t")[5] AS MTime,
             "HIGH" AS Severity,
             "World-writable configuration file" AS Reason
      FROM foreach(
        row=Raw,
        query={
          SELECT Line
          FROM parse_lines(accessor="data", filename=Stdout)
          WHERE Line
        }
      )
